name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run check

      - name: Build
        run: npm run build

  python-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy psycopg2-binary httpx python-dotenv python-multipart itsdangerous openai

      - name: Check Python syntax
        run: |
          python -m py_compile python_backend/main.py
          python -m py_compile python_backend/auth.py
          python -m py_compile python_backend/models.py
          python -m py_compile python_backend/schemas.py
          python -m py_compile python_backend/csv_parser.py
          python -m py_compile python_backend/database.py
